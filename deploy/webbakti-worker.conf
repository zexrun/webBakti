# Supervisor program for the Laravel queue worker.
#
# Copy to /etc/supervisor/conf.d/webbakti-worker.conf, then:
#   sudo supervisorctl reread
#   sudo supervisorctl update
#   sudo supervisorctl start webbakti-worker:*

[program:webbakti-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/webbakti/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/webbakti/storage/logs/worker.log
stopwaitsecs=3600
