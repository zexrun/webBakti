# Apache virtual host for Magang BAKTI.
#
# Copy to /etc/apache2/sites-available/webbakti.conf, edit ServerName,
# then:
#   sudo a2ensite webbakti.conf
#   sudo a2dissite 000-default.conf
#   sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName magang-bakti.local

    DocumentRoot /var/www/webbakti/public

    <Directory /var/www/webbakti/public>
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/webbakti-error.log
    CustomLog ${APACHE_LOG_DIR}/webbakti-access.log combined
</VirtualHost>
